# Premium Hub — Nginx reverse proxy
#
# 1. Replace store/admin/api.example.com with your real domains.
# 2. Copy to the VPS:  sudo cp premium-hub.conf /etc/nginx/sites-available/premium-hub.conf
#    sudo ln -s /etc/nginx/sites-available/premium-hub.conf /etc/nginx/sites-enabled/
# 3. Test + reload:    sudo nginx -t && sudo systemctl reload nginx
# 4. HTTPS (also adds the 80->443 redirect):
#    sudo certbot --nginx -d store.example.com -d admin.example.com -d api.example.com
#
# The Docker containers listen on 127.0.0.1 only (store: 3002, admin: 3000,
# api: 3001), so Nginx on the same machine is the only public entry point.

# --------------------------------------------------- storefront (customer site)
server {
    listen 80;
    listen [::]:80;
    server_name store.example.com;

    # Card-to-card receipt uploads travel as base64 JSON — allow a few MB.
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------------------------------------------------------- admin panel
server {
    listen 80;
    listen [::]:80;
    server_name admin.example.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------- API + Telegram webhook
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # Telegram webhook posts JSON updates here; 1m is plenty.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
