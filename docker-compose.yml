services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-premium_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-premium_hub}
      POSTGRES_DB: ${POSTGRES_DB:-premium_hub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Localhost only — never expose Postgres publicly.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-premium_hub} -d ${POSTGRES_DB:-premium_hub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-premium_hub}:${POSTGRES_PASSWORD:-premium_hub}@postgres:5432/${POSTGRES_DB:-premium_hub}?schema=public
      NODE_ENV: production
    ports:
      # Localhost only — Nginx terminates TLS and proxies to this port.
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  admin:
    build:
      context: .
      dockerfile: docker/admin.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    env_file: .env
    environment:
      API_INTERNAL_URL: http://api:3001
      NODE_ENV: production
    ports:
      # Localhost only — Nginx terminates TLS and proxies to this port.
      - "127.0.0.1:3000:3000"

  # Daily logical backups kept for 14 days (pg_dump into ./backups).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-premium_hub}
    volumes:
      - ./backups:/backups
    entrypoint: >
      /bin/sh -c 'while true; do
        pg_dump -h postgres -U ${POSTGRES_USER:-premium_hub} ${POSTGRES_DB:-premium_hub} | gzip > /backups/premium_hub_$$(date +%Y%m%d_%H%M%S).sql.gz;
        find /backups -name "*.sql.gz" -mtime +14 -delete;
        sleep 86400;
      done'

volumes:
  postgres_data:
